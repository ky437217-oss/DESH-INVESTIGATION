<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Desh Investigation — देश की हर बड़ी खबर की पड़ताल</title>

<meta
  name="description"
  content="Desh Investigation — source-based Hindi news, analysis और महत्वपूर्ण घटनाक्रम।"
/>

<style>

*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

:root{
  --red:#d71935;
  --dark:#111827;
  --muted:#667085;
  --border:#e5e7eb;
  --soft:#f6f7f9;
  --white:#ffffff;
}

body{
  font-family:
    "Noto Sans Devanagari",
    "Segoe UI",
    Arial,
    sans-serif;

  background:#f5f6f8;
  color:var(--dark);
}

button,
input{
  font:inherit;
}

button{
  cursor:pointer;
}

/* HEADER */

.header{
  position:sticky;
  top:0;
  z-index:50;

  background:rgba(255,255,255,.96);
  backdrop-filter:blur(14px);

  border-bottom:1px solid var(--border);
}

.header-inner{
  max-width:1440px;
  margin:auto;
  padding:15px 24px;

  display:flex;
  align-items:center;
  gap:24px;
}

.logo{
  display:flex;
  align-items:center;
  gap:12px;
  min-width:max-content;
}

.logo-mark{
  width:42px;
  height:42px;
  border-radius:12px;

  background:var(--red);
  color:white;

  display:grid;
  place-items:center;

  font-size:15px;
  font-weight:950;
  letter-spacing:-1px;
}

.logo-text{
  line-height:1.05;
}

.logo-title{
  font-size:16px;
  font-weight:950;
  letter-spacing:.5px;
}

.logo-sub{
  margin-top:4px;
  font-size:10px;
  color:var(--muted);
  font-weight:800;
}

.search{
  flex:1;
  max-width:540px;
  position:relative;
}

.search input{
  width:100%;

  border:1px solid #dfe3e8;
  background:#f8f9fb;

  border-radius:12px;
  padding:12px 15px 12px 42px;

  outline:none;
}

.search input:focus{
  border-color:#b6bdc8;
  background:white;
}

.search-icon{
  position:absolute;
  left:15px;
  top:50%;
  transform:translateY(-50%);
  color:#98a2b3;
}

.header-status{
  margin-left:auto;

  display:flex;
  align-items:center;
  gap:8px;

  color:#475467;
  font-size:11px;
  font-weight:850;
}

.live-dot{
  width:8px;
  height:8px;
  border-radius:50%;
  background:#12b76a;
}

/* NAV */

.nav{
  background:white;
  border-bottom:1px solid var(--border);
}

.nav-inner{
  max-width:1440px;
  margin:auto;

  padding:11px 24px;

  display:flex;
  gap:8px;
  overflow:auto;
}

.nav button{
  border:0;
  background:transparent;

  padding:8px 13px;
  border-radius:9px;

  color:#475467;
  font-weight:850;
  font-size:12px;
  white-space:nowrap;
}

.nav button:hover{
  background:#f2f4f7;
}

.nav button.active{
  background:#feecef;
  color:var(--red);
}

/* MAIN */

.container{
  max-width:1440px;
  margin:auto;
  padding:28px 24px 60px;
}

/* HERO */

.hero{
  display:grid;
  grid-template-columns:1.65fr 1fr;
  gap:20px;

  margin-bottom:24px;
}

.hero-main,
.hero-side{
  background:white;
  border:1px solid var(--border);
  border-radius:18px;
  overflow:hidden;
  box-shadow:0 7px 28px rgba(16,24,40,.05);
}

.hero-image{
  width:100%;
  height:350px;
  background:#e9edf2;
  object-fit:cover;
  display:block;
}

.hero-content{
  padding:23px;
}

.category{
  display:inline-flex;
  align-items:center;

  padding:5px 9px;
  border-radius:999px;

  background:#feecef;
  color:var(--red);

  font-size:10px;
  font-weight:950;
  text-transform:uppercase;
}

.hero-title{
  margin-top:13px;

  font-size:31px;
  line-height:1.35;
  font-weight:950;
  letter-spacing:-.5px;
}

.hero-summary{
  margin-top:12px;

  color:#667085;
  line-height:1.75;
  font-size:14px;
}

.hero-meta{
  margin-top:15px;

  display:flex;
  flex-wrap:wrap;
  gap:10px;

  font-size:11px;
  color:#98a2b3;
  font-weight:800;
}

.hero-side{
  padding:21px;
}

.side-title{
  font-size:16px;
  font-weight:950;
}

.side-list{
  margin-top:15px;
  display:grid;
  gap:12px;
}

.side-item{
  padding:13px;
  border:1px solid var(--border);
  border-radius:13px;
  background:#fafafa;
}

.side-item:hover{
  background:white;
}

.side-item h3{
  font-size:14px;
  line-height:1.5;
}

.side-item .small{
  margin-top:7px;
  color:#98a2b3;
  font-size:10px;
  font-weight:800;
}

/* SECTION */

.section-head{
  display:flex;
  justify-content:space-between;
  align-items:end;
  gap:15px;

  margin:30px 0 14px;
}

.section-title{
  font-size:21px;
  font-weight:950;
}

.section-count{
  color:#98a2b3;
  font-size:11px;
  font-weight:850;
}

/* GRID */

.news-grid{
  display:grid;

  grid-template-columns:
    repeat(4,minmax(0,1fr));

  gap:18px;
}

.card{
  background:white;
  border:1px solid var(--border);
  border-radius:16px;

  overflow:hidden;
  transition:
    transform .18s ease,
    box-shadow .18s ease;
}

.card:hover{
  transform:translateY(-3px);
  box-shadow:0 12px 32px rgba(16,24,40,.08);
}

.card-image{
  width:100%;
  height:185px;

  display:block;
  object-fit:cover;

  background:#edf0f3;
}

.card-body{
  padding:16px;
}

.card-title{
  margin-top:9px;

  font-size:16px;
  line-height:1.55;
  font-weight:900;
}

.card-summary{
  margin-top:8px;

  color:#667085;
  font-size:12px;
  line-height:1.65;
}

.card-meta{
  margin-top:13px;

  display:flex;
  justify-content:space-between;
  gap:8px;

  color:#98a2b3;
  font-size:9px;
  font-weight:800;
}

/* LOADING */

.loading{
  padding:60px 20px;
  text-align:center;
  color:#667085;
}

/* ERROR */

.error{
  padding:40px;
  text-align:center;

  background:white;
  border:1px solid var(--border);
  border-radius:16px;

  color:#b42318;
}

/* ARTICLE */

.article{
  display:none;
}

.article.active{
  display:block;
}

.article-box{
  max-width:950px;
  margin:auto;

  background:white;
  border:1px solid var(--border);
  border-radius:20px;

  overflow:hidden;
}

.article-image{
  width:100%;
  max-height:500px;
  object-fit:cover;
  display:block;
  background:#edf0f3;
}

.article-content{
  padding:30px;
}

.article-title{
  margin-top:14px;

  font-size:38px;
  line-height:1.4;
  font-weight:950;
}

.article-summary{
  margin-top:15px;

  color:#667085;
  font-size:15px;
  line-height:1.85;
}

.article-block{
  margin-top:28px;
}

.article-block h2{
  margin-bottom:12px;
  font-size:20px;
  font-weight:950;
}

.article-block p{
  color:#344054;
  line-height:1.85;
}

.article-block ul{
  padding-left:22px;
}

.article-block li{
  margin:8px 0;
  color:#344054;
  line-height:1.7;
}

.source-box{
  margin-top:30px;
  padding:18px;

  border:1px solid #e4e7ec;
  border-radius:14px;

  background:#fafafa;
}

.source-box a{
  color:#175cd3;
  word-break:break-all;
}

.back-btn{
  border:0;
  background:#111827;
  color:white;

  padding:10px 15px;
  border-radius:10px;

  font-weight:850;
  margin-bottom:18px;
}

/* FOOTER */

footer{
  margin-top:50px;

  background:#111827;
  color:#d0d5dd;
}

.footer-inner{
  max-width:1440px;
  margin:auto;
  padding:30px 24px;

  display:flex;
  justify-content:space-between;
  gap:20px;
}

.footer-brand{
  font-weight:950;
  color:white;
}

.footer-copy{
  font-size:11px;
}

/* RESPONSIVE */

@media(max-width:1100px){
  .news-grid{
    grid-template-columns:repeat(3,minmax(0,1fr));
  }
}

@media(max-width:850px){

  .header-inner{
    flex-wrap:wrap;
  }

  .search{
    order:3;
    max-width:none;
    flex-basis:100%;
  }

  .hero{
    grid-template-columns:1fr;
  }

  .hero-image{
    height:280px;
  }

  .news-grid{
    grid-template-columns:repeat(2,minmax(0,1fr));
  }

  .hero-title{
    font-size:25px;
  }

  .article-title{
    font-size:28px;
  }
}

@media(max-width:560px){

  .container{
    padding:18px 14px 40px;
  }

  .header-inner{
    padding:12px 14px;
  }

  .nav-inner{
    padding:9px 14px;
  }

  .news-grid{
    grid-template-columns:1fr;
  }

  .hero-image{
    height:230px;
  }

  .article-content{
    padding:20px;
  }

  .footer-inner{
    flex-direction:column;
  }
}

</style>
</head>

<body>

<header class="header">

  <div class="header-inner">

    <div class="logo">

      <div class="logo-mark">
        DI
      </div>

      <div class="logo-text">

        <div class="logo-title">
          DESH INVESTIGATION
        </div>

        <div class="logo-sub">
          पड़ताल • तथ्य • विश्लेषण
        </div>

      </div>

    </div>

    <div class="search">

      <span class="search-icon">⌕</span>

      <input
        id="searchInput"
        type="search"
        placeholder="खबर खोजें..."
      />

    </div>

    <div class="header-status">
      <span class="live-dot"></span>
      LIVE NEWSROOM
    </div>

  </div>

</header>


<nav class="nav">

  <div class="nav-inner">

    <button
      class="active"
      data-category="All"
    >
      सभी
    </button>

    <button data-category="India">
      India
    </button>

    <button data-category="World">
      World
    </button>

    <button data-category="Politics">
      Politics
    </button>

    <button data-category="Crime">
      Crime
    </button>

    <button data-category="AI">
      AI
    </button>

    <button data-category="Sports">
      Sports
    </button>

  </div>

</nav>


<main class="container">

  <section id="homeView">

    <div
      id="hero"
      class="hero"
    >
      <div class="loading">
        खबरें लोड हो रही हैं...
      </div>
    </div>


    <div class="section-head">

      <div class="section-title">
        Latest News
      </div>

      <div
        id="count"
        class="section-count"
      >
        Loading...
      </div>

    </div>


    <div
      id="newsGrid"
      class="news-grid"
    >
      <div class="loading">
        समाचार लोड हो रहे हैं...
      </div>
    </div>

  </section>


  <section
    id="articleView"
    class="article"
  >

    <button
      id="backButton"
      class="back-btn"
    >
      ← वापस सभी खबरें
    </button>

    <div
      id="articleContainer"
      class="article-box"
    ></div>

  </section>

</main>


<footer>

  <div class="footer-inner">

    <div>

      <div class="footer-brand">
        DESH INVESTIGATION
      </div>

      <div
        class="footer-copy"
        style="margin-top:7px"
      >
        Source-based Hindi news and analysis
      </div>

    </div>

    <div class="footer-copy">
      © 2026 Desh Investigation
    </div>

  </div>

</footer>


<script>

const state = {
  all: [],
  filtered: [],
  category: "All",
  search: ""
};

const homeView =
  document.getElementById(
    "homeView"
  );

const articleView =
  document.getElementById(
    "articleView"
  );

const hero =
  document.getElementById(
    "hero"
  );

const newsGrid =
  document.getElementById(
    "newsGrid"
  );

const count =
  document.getElementById(
    "count"
  );

const searchInput =
  document.getElementById(
    "searchInput"
  );

const articleContainer =
  document.getElementById(
    "articleContainer"
  );

function esc(value){

  const div =
    document.createElement("div");

  div.textContent =
    value == null
      ? ""
      : String(value);

  return div.innerHTML;
}

function slug(value){

  return String(value || "")
    .toLowerCase()
    .trim()
    .replace(
      /[^\w\u0900-\u097F]+/g,
      "-"
    )
    .replace(
      /^-+|-+$/g,
      ""
    )
    .slice(0,110);

}

function imageFor(item){

  return (
    item.featuredImage ||
    item.imageUrl ||
    ""
  );

}

function imageSrc(item){

  const image =
    imageFor(item);

  if(!image){
    return "";
  }

  return (
    "/api/image?url=" +
    encodeURIComponent(image)
  );

}

function summaryFor(item){

  return (
    item.summary ||
    item.analysis ||
    "इस खबर की विस्तृत जानकारी Desh Investigation पर पढ़ें।"
  );

}

function formatDate(value){

  if(!value){
    return "तारीख उपलब्ध नहीं";
  }

  const d =
    new Date(value);

  if(
    Number.isNaN(
      d.getTime()
    )
  ){
    return String(value);
  }

  return d.toLocaleDateString(
    "hi-IN",
    {
      day:"numeric",
      month:"short",
      year:"numeric"
    }
  );

}

function normalize(item,index){

  return {
    ...item,

    __index:index,

    __slug:
      item.slug ||
      slug(
        item.title
      ) ||
      `story-${index+1}`

  };

}

async function loadNews(){

  try{

    const response =
      await fetch(
        "/api/published-news",
        {
          cache:"no-store"
        }
      );

    if(!response.ok){
      throw new Error(
        "News API failed"
      );
    }

    const data =
      await response.json();

    state.all =
      Array.isArray(data)
        ? data.map(normalize)
        : [];

    applyFilters();

  }catch(error){

    hero.innerHTML = `
      <div class="error">
        खबरें लोड नहीं हो सकीं।
        <br>
        <small>${esc(error.message)}</small>
      </div>
    `;

    newsGrid.innerHTML = "";

  }

}

function applyFilters(){

  const q =
    state.search
      .trim()
      .toLowerCase();

  state.filtered =
    state.all.filter(item => {

      const categoryOk =
        state.category === "All" ||
        String(
          item.category || ""
        ).toLowerCase() ===
        state.category.toLowerCase();

      const text =
        [
          item.title,
          item.originalTitle,
          item.summary,
          item.analysis,
          item.source
        ]
        .filter(Boolean)
        .join(" ")
        .toLowerCase();

      const searchOk =
        !q ||
        text.includes(q);

      return (
        categoryOk &&
        searchOk
      );

    });

  renderHero();
  renderGrid();

}

function renderHero(){

  if(!state.filtered.length){

    hero.innerHTML = `
      <div class="hero-main">
        <div class="loading">
          इस category/search में कोई खबर नहीं मिली।
        </div>
      </div>
    `;

    count.textContent =
      "0 खबरें";

    return;
  }

  const main =
    state.filtered[0];

  const side =
    state.filtered.slice(
      1,
      5
    );

  const image =
    imageSrc(main);

  hero.innerHTML = `

    <article
      class="hero-main"
      onclick="openArticle(${main.__index})"
      style="cursor:pointer"
    >

      ${
        image
          ? `
            <img
              class="hero-image"
              src="${esc(image)}"
              alt="${esc(main.title)}"
              loading="eager"
              onerror="this.style.display='none'"
            >
          `
          : ""
      }

      <div class="hero-content">

        <span class="category">
          ${esc(main.category || "NEWS")}
        </span>

        <h1 class="hero-title">
          ${esc(main.title)}
        </h1>

        <p class="hero-summary">
          ${esc(summaryFor(main))}
        </p>

        <div class="hero-meta">

          <span>
            ${esc(main.source || "Desh Investigation")}
          </span>

          <span>
            ${esc(
              formatDate(
                main.publishedAt ||
                main.published_at ||
                main.createdAt
              )
            )}
          </span>

        </div>

      </div>

    </article>


    <aside class="hero-side">

      <div class="side-title">
        अभी की प्रमुख खबरें
      </div>

      <div class="side-list">

        ${
          side.length
            ? side.map(item => `

              <div
                class="side-item"
                onclick="openArticle(${item.__index})"
                style="cursor:pointer"
              >

                <span class="category">
                  ${esc(item.category || "NEWS")}
                </span>

                <h3>
                  ${esc(item.title)}
                </h3>

                <div class="small">
                  ${esc(item.source || "")}
                  ·
                  ${esc(
                    formatDate(
                      item.publishedAt ||
                      item.published_at
                    )
                  )}
                </div>

              </div>

            `).join("")
            : `
              <div class="small">
                और खबरें उपलब्ध नहीं हैं।
              </div>
            `
        }

      </div>

    </aside>

  `;

  count.textContent =
    `${state.filtered.length} खबरें`;

}

function renderGrid(){

  if(!state.filtered.length){

    newsGrid.innerHTML = "";

    return;
  }

  const items =
    state.filtered
      .slice(0,40);

  newsGrid.innerHTML =
    items.map(item => {

      const image =
        imageSrc(item);

      return `

        <article
          class="card"
          onclick="openArticle(${item.__index})"
          style="cursor:pointer"
        >

          ${
            image
              ? `
                <img
                  class="card-image"
                  src="${esc(image)}"
                  alt="${esc(item.title)}"
                  loading="lazy"
                  onerror="this.style.display='none'"
                >
              `
              : `
                <div
                  class="card-image"
                  style="
                    position:relative;
                    overflow:hidden;
                    display:flex;
                    flex-direction:column;
                    justify-content:flex-end;
                    padding:18px;
                    background:
                      linear-gradient(
                        135deg,
                        #f8fafc,
                        #e2e8f0
                      );
                  "
                >

                  <div
                    style="
                      position:absolute;
                      width:150px;
                      height:150px;
                      right:-50px;
                      top:-60px;
                      border-radius:50%;
                      background:
                        rgba(215,25,53,.13);
                    "
                  ></div>

                  <div
                    style="
                      position:absolute;
                      width:120px;
                      height:120px;
                      left:-55px;
                      bottom:-70px;
                      border-radius:50%;
                      background:
                        rgba(15,23,42,.06);
                    "
                  ></div>

                  <div
                    style="
                      position:relative;
                      z-index:2;
                      font-size:9px;
                      font-weight:950;
                      letter-spacing:1.5px;
                      color:#d71935;
                    "
                  >
                    DESH INVESTIGATION
                  </div>

                  <div
                    style="
                      position:relative;
                      z-index:2;
                      margin-top:7px;
                      max-width:90%;
                      font-size:13px;
                      line-height:1.45;
                      font-weight:900;
                      color:#172033;
                    "
                  >
                    ${esc(item.title || "Latest News")}
                  </div>

                  <div
                    style="
                      position:relative;
                      z-index:2;
                      margin-top:7px;
                      font-size:8px;
                      font-weight:850;
                      color:#667085;
                    "
                  >
                    ${esc(item.category || "NEWS")}
                  </div>

                </div>
              `
          }

          <div class="card-body">

            <span class="category">
              ${esc(item.category || "NEWS")}
            </span>

            <div class="card-title">
              ${esc(item.title)}
            </div>

            <div class="card-summary">
              ${esc(
                summaryFor(item)
                  .slice(0,190)
              )}${summaryFor(item).length > 190 ? "…" : ""}
            </div>

            <div class="card-meta">

              <span>
                ${esc(item.source || "")}
              </span>

              <span>
                ${esc(
                  formatDate(
                    item.publishedAt ||
                    item.published_at
                  )
                )}
              </span>

            </div>

          </div>

        </article>

      `;

    }).join("");

}

function openArticle(index){

  const item =
    state.all.find(
      x =>
        Number(x.__index) ===
        Number(index)
    );

  if(!item){
    return;
  }

  const image =
    imageSrc(item);

  const keyFacts =
    Array.isArray(
      item.keyFacts
    )
      ? item.keyFacts
      : [];

  articleContainer.innerHTML = `

    ${
      image
        ? `
          <img
            class="article-image"
            src="${esc(image)}"
            alt="${esc(item.title)}"
            onerror="this.style.display='none'"
          >
        `
        : ""
    }

    <div class="article-content">

      <span class="category">
        ${esc(item.category || "NEWS")}
      </span>

      <h1 class="article-title">
        ${esc(item.title)}
      </h1>

      <div class="hero-meta">
        <span>
          ${esc(item.source || "Desh Investigation")}
        </span>

        <span>
          ${esc(
            formatDate(
              item.publishedAt ||
              item.published_at
            )
          )}
        </span>
      </div>

      <div class="article-block">

        <p class="article-summary">
          ${esc(summaryFor(item))}
        </p>

      </div>


      ${
        keyFacts.length
          ? `
            <div class="article-block">

              <h2>
                मुख्य बिंदु
              </h2>

              <ul>

                ${keyFacts.map(
                  fact =>
                    `<li>${esc(fact)}</li>`
                ).join("")}

              </ul>

            </div>
          `
          : ""
      }


      ${
        item.analysis
          ? `
            <div class="article-block">

              <h2>
                विश्लेषण
              </h2>

              <p>
                ${esc(item.analysis)}
              </p>

            </div>
          `
          : ""
      }


      <div class="source-box">

        <strong>
          मूल स्रोत
        </strong>

        <div style="margin-top:8px">

          ${
            item.sourceUrl
              ? `
                <a
                  href="${esc(item.sourceUrl)}"
                  target="_blank"
                  rel="noopener noreferrer"
                >
                  ${esc(item.sourceUrl)}
                </a>
              `
              : `
                स्रोत URL उपलब्ध नहीं है।
              `
          }

        </div>

      </div>

    </div>

  `;

  homeView.style.display =
    "none";

  articleView.classList.add(
    "active"
  );

  window.scrollTo(
    {
      top:0,
      behavior:"smooth"
    }
  );

  history.pushState(
    {},
    "",
    "?story=" +
    encodeURIComponent(
      item.__slug
    )
  );

}

function closeArticle(){

  articleView.classList.remove(
    "active"
  );

  homeView.style.display =
    "block";

  history.pushState(
    {},
    "",
    location.pathname
  );

  window.scrollTo({
    top:0,
    behavior:"smooth"
  });

}

document
  .getElementById("backButton")
  .addEventListener(
    "click",
    closeArticle
  );


document
  .querySelectorAll(
    ".nav button"
  )
  .forEach(button => {

    button.addEventListener(
      "click",
      () => {

        document
          .querySelectorAll(
            ".nav button"
          )
          .forEach(
            x =>
              x.classList.remove(
                "active"
              )
          );

        button.classList.add(
          "active"
        );

        state.category =
          button.dataset.category;

        applyFilters();

        window.scrollTo({
          top:0,
          behavior:"smooth"
        });

      }
    );

  });


searchInput.addEventListener(
  "input",
  event => {

    state.search =
      event.target.value;

    applyFilters();

  }
);


window.addEventListener(
  "popstate",
  () => {

    closeArticle();

  }
);


loadNews();

</script>
